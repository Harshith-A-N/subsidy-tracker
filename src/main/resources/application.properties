spring.application.name=subsidy-tracker

# ---- Database (Neon Serverless PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-lively-unit-aegs4h8q-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_rDHfLEqRK5l6}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.data.web.pageable.serialization-mode=via-dto
spring.sql.init.mode=never
app.seeding.enabled=false

# ---- HikariCP Pool (Optimized for Serverless PostgreSQL / Cloud DBs) ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

# ---- JWT ----
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- Cloudinary (Document Upload) ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:changeme}
cloudinary.api-key=${CLOUDINARY_API_KEY:changeme}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:changeme}

# ---- Multipart Upload Limits ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Treasury Integration ----
treasury.mock.base-url=${TREASURY_MOCK_BASE_URL:http://localhost:8080/mock/external-treasury}