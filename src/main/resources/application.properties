spring.application.name=subsidy-tracker

# ---- Database ----
# Defaults to H2 in-memory (for Render/CI). Override via .env or env vars for MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:subsidy_tracker_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---- JWT ----
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- Cloudinary (Document Upload) ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:changeme}
cloudinary.api-key=${CLOUDINARY_API_KEY:changeme}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:changeme}

# ---- Multipart Upload Limits ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Treasury Integration ----
treasury.mock.base-url=${TREASURY_MOCK_BASE_URL:http://localhost:8080/mock/external-treasury}